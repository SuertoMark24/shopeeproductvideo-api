<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111214">
<title>Shopee Videos</title>
<style>
  :root {
    --bg: #111214; --card: #1b1d21; --line: #2a2d33; --text: #f2f3f5; --muted: #9aa0a8;
    --accent: #ee4d2d; --accent-ink: #fff; --ok: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(17,18,20,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .count { color: var(--muted); font-size: 13px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 18px; }
  .card video { display: block; width: 100%; max-height: 70vh; background: #000; }
  .body { padding: 14px; display: grid; gap: 12px; }
  .title { font-weight: 600; font-size: 15px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .text { white-space: pre-wrap; word-break: break-word; background: #141518; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font-size: 14px; user-select: text; -webkit-user-select: text; }
  .url { color: #8ab4ff; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 130px; appearance: none; border: 0; border-radius: 12px; padding: 13px 12px; font-size: 15px;
    font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; background: #2a2d33; color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn:active { transform: scale(.98); }
  .btn.done { background: var(--ok); color: #0b1a17; }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 10px; }
  .login { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; display: grid; gap: 12px; }
  .login input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 16px; }
  .err { color: #ff8a80; font-size: 14px; min-height: 1.2em; }
  .link { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px); background: var(--ok);
    color: #0b1a17; padding: 10px 16px; border-radius: 999px; font-weight: 700; transition: transform .2s; z-index: 10; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const KEY = 'spv-pass';
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getPass = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
const setPass = (v) => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} };
let items = [];
let memPass = getPass();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copy(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  if (ok) {
    toast('Copied ✓');
    if (btn) { const old = btn.textContent; btn.classList.add('done'); btn.textContent = 'Copied ✓';
      setTimeout(() => { btn.classList.remove('done'); btn.textContent = old; }, 1500); }
  } else toast('Long-press the text to copy');
}

// Share sheet with the actual file (iOS: "Save Video" to Photos). Falls back to a normal download.
async function save(item, btn) {
  if (navigator.canShare && window.File) {
    try {
      btn.textContent = 'Preparing…';
      const r = await fetch(item.videoUrl);
      const blob = await r.blob();
      const file = new File([blob], (item.title || 'video').replace(/[^\w\- ]+/g, '').slice(0, 60) + '.mp4', { type: 'video/mp4' });
      if (navigator.canShare({ files: [file] })) {
        btn.textContent = 'Save / Share';
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') { btn.textContent = 'Save / Share'; return; } }
    btn.textContent = 'Save / Share';
  }
  location.href = item.downloadUrl || item.videoUrl;
}

function login(error) {
  app.innerHTML = `
    <form class="login" id="f">
      <h1 style="margin:0;font-size:22px">Shopee Videos</h1>
      <input id="p" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus>
      <button class="btn primary" type="submit">Open</button>
      <div class="err">${esc(error || '')}</div>
    </form>`;
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    memPass = document.getElementById('p').value.trim();
    setPass(memPass);
    load();
  };
}

async function load() {
  if (!memPass) return login();
  app.innerHTML = '<div class="msg">Loading…</div>';
  let r;
  try { r = await fetch('/api/items', { headers: { 'x-passphrase': memPass }, cache: 'no-store' }); }
  catch { app.innerHTML = '<div class="msg">No connection. Pull down to retry.</div>'; return; }
  if (r.status === 401) { memPass = ''; setPass(''); return login('Wrong passphrase'); }
  const data = await r.json();
  items = data.items || [];
  render(data.max || 10);
}

function render(max) {
  const cards = items.map((it, i) => `
    <article class="card">
      <video src="${esc(it.videoUrl)}" controls playsinline preload="metadata"></video>
      <div class="body">
        ${it.title ? `<div class="title">${esc(it.title)}</div>` : ''}
        <div class="row">
          <a class="btn primary" href="${esc(it.downloadUrl || it.videoUrl)}" download>Download</a>
          <button class="btn" data-save="${i}">Save / Share</button>
        </div>
        <div>
          <div class="label">Shopee caption</div>
          <div class="text">${esc(it.caption) || '<span style="color:var(--muted)">(none)</span>'}</div>
        </div>
        <button class="btn" data-copy-caption="${i}">Copy caption</button>
        <div>
          <div class="label">Shopee link</div>
          <div class="text url">${esc(it.shopeeUrl) || '<span style="color:var(--muted)">(none)</span>'}</div>
        </div>
        <div class="row">
          <button class="btn" data-copy-url="${i}">Copy link</button>
          ${it.shopeeUrl ? `<a class="btn" href="${esc(it.shopeeUrl)}" target="_blank" rel="noopener">Open in Shopee</a>` : ''}
        </div>
      </div>
    </article>`).join('');

  app.innerHTML = `
    <header><h1>Shopee Videos</h1><span class="count">${items.length} / ${max}</span>
      <button class="link" id="refresh">Refresh</button><button class="link" id="out">Lock</button></header>
    <main>${cards || '<div class="empty">No videos yet. Add them from Stitchify.</div>'}</main>`;

  document.getElementById('refresh').onclick = load;
  document.getElementById('out').onclick = () => { memPass = ''; setPass(''); login(); };
  app.querySelectorAll('[data-copy-caption]').forEach((b) => b.onclick = () => copy(items[b.dataset.copyCaption].caption || '', b));
  app.querySelectorAll('[data-copy-url]').forEach((b) => b.onclick = () => copy(items[b.dataset.copyUrl].shopeeUrl || '', b));
  app.querySelectorAll('[data-save]').forEach((b) => b.onclick = () => save(items[b.dataset.save], b));
}

load();
</script>
</body>
</html>
