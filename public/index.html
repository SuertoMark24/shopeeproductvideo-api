<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111214">
<title>Shopee Videos</title>
<style>
  :root {
    --bg: #111214; --card: #1b1d21; --line: #2a2d33; --text: #f2f3f5; --muted: #9aa0a8;
    --accent: #ee4d2d; --accent-ink: #fff; --ok: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(17,18,20,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .count { color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 8px 10px 40px; }

  /* Compact table: Video | Caption | Link | Save — one short row per video. */
  .tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .tbl th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .c-vid { width: 64px; } .c-link { width: 72px; } .c-save { width: 60px; }
  .thumb { position: relative; width: 56px; height: 84px; border-radius: 8px; overflow: hidden; background: #000;
    border: 0; padding: 0; cursor: pointer; display: block; }
  .thumb video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
  .thumb::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff;
    font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .cap { font-size: 13px; line-height: 1.35; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ttl { font-size: 11px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .none { color: var(--muted); font-size: 12px; }
  .pill { display: block; width: 100%; appearance: none; border: 0; border-radius: 8px; padding: 7px 4px; margin-top: 6px;
    font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer;
    background: #2a2d33; color: var(--text); }
  .pill:first-child { margin-top: 0; }
  .pill.primary { background: var(--accent); color: var(--accent-ink); }
  .pill.done { background: var(--ok); color: #0b1a17; }
  .pill:active { transform: scale(.97); }

  /* Tap a thumbnail → full player. */
  #viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  #viewer.open { display: flex; }
  #viewer video { max-width: 100%; max-height: 75vh; border-radius: 12px; background: #000; }
  #viewer .bar { display: flex; gap: 8px; width: 100%; max-width: 420px; }
  #viewer .bar > * { flex: 1; margin-top: 0; padding: 12px 6px; font-size: 14px; }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 10px; }
  .login { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; display: grid; gap: 12px; }
  .login input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 16px; }
  .err { color: #ff8a80; font-size: 14px; min-height: 1.2em; }
  .link { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px); background: var(--ok);
    color: #0b1a17; padding: 10px 16px; border-radius: 999px; font-weight: 700; transition: transform .2s; z-index: 10; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="viewer"></div>
<script>
const KEY = 'spv-pass';
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getPass = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
const setPass = (v) => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} };
let items = [];
let memPass = getPass();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copy(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  if (ok) {
    toast('Copied ✓');
    if (btn) { const old = btn.textContent; btn.classList.add('done'); btn.textContent = 'Copied ✓';
      setTimeout(() => { btn.classList.remove('done'); btn.textContent = old; }, 1500); }
  } else toast('Long-press the text to copy');
}

function openViewer(item) {
  const v = document.getElementById('viewer');
  v.innerHTML = `
    <video src="${esc(item.videoUrl)}" controls autoplay playsinline></video>
    <div class="bar">
      <a class="pill primary" href="${esc(item.downloadUrl || item.videoUrl)}" download>Download</a>
      <button class="pill" id="v-close">Close</button>
    </div>`;
  v.classList.add('open');
  const close = () => { v.classList.remove('open'); v.innerHTML = ''; };
  document.getElementById('v-close').onclick = close;
  v.onclick = (e) => { if (e.target === v) close(); };
}

function login(error) {
  app.innerHTML = `
    <form class="login" id="f">
      <h1 style="margin:0;font-size:22px">Shopee Videos</h1>
      <input id="p" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus>
      <button class="pill primary" type="submit" style="padding:13px;font-size:15px">Open</button>
      <div class="err">${esc(error || '')}</div>
    </form>`;
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    memPass = document.getElementById('p').value.trim();
    setPass(memPass);
    load();
  };
}

async function load() {
  if (!memPass) return login();
  app.innerHTML = '<div class="msg">Loading…</div>';
  let r;
  try { r = await fetch('/api/items', { headers: { 'x-passphrase': memPass }, cache: 'no-store' }); }
  catch { app.innerHTML = '<div class="msg">No connection. Pull down to retry.</div>'; return; }
  if (r.status === 401) { memPass = ''; setPass(''); return login('Wrong passphrase'); }
  const data = await r.json();
  items = data.items || [];
  render(data.max || 10);
}

function render(max) {
  // #t=0.1 makes iOS/Android paint the first frame as a thumbnail without playing.
  const rows = items.map((it, i) => `
    <tr>
      <td><button class="thumb" data-play="${i}" aria-label="Play"><video src="${esc(it.videoUrl)}#t=0.1" muted playsinline preload="metadata"></video></button></td>
      <td>
        ${it.title ? `<div class="ttl">${esc(it.title)}</div>` : ''}
        ${it.caption ? `<div class="cap">${esc(it.caption)}</div>` : '<div class="none">(no caption)</div>'}
        ${it.caption ? `<button class="pill" data-copy-caption="${i}" style="width:auto;padding:6px 12px">Copy caption</button>` : ''}
      </td>
      <td>
        ${it.shopeeUrl
          ? `<button class="pill" data-copy-url="${i}">Copy</button>
             <a class="pill" href="${esc(it.shopeeUrl)}" target="_blank" rel="noopener">Open</a>`
          : '<div class="none">—</div>'}
      </td>
      <td>
        <a class="pill primary" href="${esc(it.downloadUrl || it.videoUrl)}" download>⬇</a>
      </td>
    </tr>`).join('');

  app.innerHTML = `
    <header><h1>Shopee Videos</h1><span class="count">${items.length} / ${max}</span>
      <button class="link" id="refresh">Refresh</button><button class="link" id="out">Lock</button></header>
    <main>${rows ? `
      <table class="tbl">
        <colgroup><col class="c-vid"><col><col class="c-link"><col class="c-save"></colgroup>
        <thead><tr><th>Video</th><th>Caption</th><th>Link</th><th>Save</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : '<div class="empty">No videos yet. Add them from Stitchify.</div>'}</main>`;

  document.getElementById('refresh').onclick = load;
  document.getElementById('out').onclick = () => { memPass = ''; setPass(''); login(); };
  app.querySelectorAll('[data-play]').forEach((b) => b.onclick = () => openViewer(items[b.dataset.play]));
  app.querySelectorAll('[data-copy-caption]').forEach((b) => b.onclick = () => copy(items[b.dataset.copyCaption].caption || '', b));
  app.querySelectorAll('[data-copy-url]').forEach((b) => b.onclick = () => copy(items[b.dataset.copyUrl].shopeeUrl || '', b));
}

load();
</script>
</body>
</html>
