<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111214">
<title>Shopee Videos</title>
<style>
  :root {
    --bg: #111214; --card: #1b1d21; --line: #2a2d33; --text: #f2f3f5; --muted: #9aa0a8;
    --accent: #ee4d2d; --accent-ink: #fff; --ok: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(17,18,20,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .count { color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 8px 10px 40px; }

  /* One card per video: preview + caption on top, the 3 big actions (Download / Copy caption / Copy link)
     right under it, and the rarely-used ones (Open, Done, Delete) small at the bottom. */
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-top: 4px; }
  .card { min-width: 0; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .card.is-done { border-color: rgba(22,163,74,.55); background: linear-gradient(0deg, rgba(22,163,74,.08), rgba(22,163,74,.08)), var(--card); }
  .top { display: flex; gap: 12px; min-width: 0; }
  .top .txt { flex: 1 1 0; min-width: 0; overflow: hidden; }
  .more { flex-wrap: wrap; }
  .thumb { position: relative; flex: none; width: 72px; height: 108px; border-radius: 10px; overflow: hidden; background: #000;
    border: 0; padding: 0; cursor: pointer; display: block; }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .big { appearance: none; border: 0; border-radius: 12px; min-height: 56px; padding: 8px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 13px; font-weight: 700; text-decoration: none; color: var(--text); background: #2a2d33; }
  .big .ico { font-size: 18px; line-height: 1; }
  .big.dl { background: var(--accent); color: var(--accent-ink); }
  .big.cp { background: #24324a; color: #cfe1ff; }
  .big.done { background: var(--ok); color: #0b1a17; }
  .big.used { box-shadow: inset 0 0 0 2px var(--ok); }
  .big:disabled { opacity: .45; cursor: default; }
  .big:active { transform: scale(.97); }
  .more { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .more .pill { width: auto; margin: 0; padding: 7px 12px; font-weight: 600; }
  .more .sp { flex: 1; }
  .thumb video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
  .thumb::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff;
    font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .cap { font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ttl { font-size: 12px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .none { color: var(--muted); font-size: 12px; }
  .pill { display: block; width: 100%; appearance: none; border: 0; border-radius: 8px; padding: 7px 4px; margin-top: 6px;
    font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer;
    background: #2a2d33; color: var(--text); }
  .pill:first-child { margin-top: 0; }
  .pill.primary { background: var(--accent); color: var(--accent-ink); }
  .pill.done { background: var(--ok); color: #0b1a17; }
  .pill.danger { background: #3a1d1d; color: #ff8a80; }
  .pill.ok { background: #16a34a; color: #fff; }
  .pill:disabled { opacity: .5; }
  .pill:active { transform: scale(.97); }

  /* Tap a thumbnail → full player. */
  #viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  #viewer.open { display: flex; }
  #viewer video { max-width: 100%; max-height: 75vh; border-radius: 12px; background: #000; }
  #viewer .bar { display: flex; gap: 8px; width: 100%; max-width: 420px; }
  #viewer .bar > * { flex: 1; margin-top: 0; padding: 12px 6px; font-size: 14px; }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 10px; }
  .login { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; display: grid; gap: 12px; }
  .login input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 16px; }
  .err { color: #ff8a80; font-size: 14px; min-height: 1.2em; }
  .link { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px); background: var(--ok);
    color: #0b1a17; padding: 10px 16px; border-radius: 999px; font-weight: 700; transition: transform .2s; z-index: 10; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="viewer"></div>
<script>
const KEY = 'spv-pass';
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getPass = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
const setPass = (v) => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} };
let items = [];
let memPass = getPass();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copy(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  if (ok) {
    toast('Copied ✓');
    // Flash "Copied ✓", then keep a green ring so you can see which steps you've already done.
    if (btn) { const old = btn.innerHTML; btn.classList.add('done', 'used');
      btn.innerHTML = '<span class="ico">✓</span>Copied';
      setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = old; }, 1500); }
  } else toast('Long-press the text to copy');
}

// Done = "posted on Shopee": the video leaves this page and goes to Stitchify's "Already uploaded".
async function markDone(item, btn) {
  if (!confirm(`Posted "${item.title || 'this video'}" on Shopee? It moves to Already uploaded.`)) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/items', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-passphrase': memPass },
      body: JSON.stringify({ action: 'done', id: item.id, done: true }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    toast('Done ✓');
    const card = btn.closest('.card');
    card.style.transition = 'opacity .25s'; card.style.opacity = '0';
    setTimeout(load, 250);
  } catch (e) {
    btn.disabled = false;
    toast('Could not save: ' + e.message);
  }
}

function openViewer(item) {
  const v = document.getElementById('viewer');
  v.innerHTML = `
    <video src="${esc(item.videoUrl)}" controls autoplay playsinline></video>
    <div class="bar">
      <a class="pill primary" href="${esc(item.downloadUrl || item.videoUrl)}" download>Download</a>
      <button class="pill" id="v-close">Close</button>
    </div>`;
  v.classList.add('open');
  const close = () => { v.classList.remove('open'); v.innerHTML = ''; };
  document.getElementById('v-close').onclick = close;
  v.onclick = (e) => { if (e.target === v) close(); };
}

function login(error) {
  app.innerHTML = `
    <form class="login" id="f">
      <h1 style="margin:0;font-size:22px">Shopee Videos</h1>
      <input id="p" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus>
      <button class="pill primary" type="submit" style="padding:13px;font-size:15px">Open</button>
      <div class="err">${esc(error || '')}</div>
    </form>`;
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    memPass = document.getElementById('p').value.trim();
    setPass(memPass);
    load();
  };
}

async function load() {
  if (!memPass) return login();
  app.innerHTML = '<div class="msg">Loading…</div>';
  let r;
  try { r = await fetch('/api/items', { headers: { 'x-passphrase': memPass }, cache: 'no-store' }); }
  catch { app.innerHTML = '<div class="msg">No connection. Pull down to retry.</div>'; return; }
  if (r.status === 401) { memPass = ''; setPass(''); return login('Wrong passphrase'); }
  const data = await r.json();
  items = (data.items || []).filter((it) => !it.done);   // done ones live in Stitchify's "Already uploaded"
  render(data.max || 10);
}

function render(max) {
  // #t=0.1 makes iOS/Android paint the first frame as a thumbnail without playing.
  const rows = items.map((it, i) => `
    <article class="card">
      <div class="top">
        <button class="thumb" data-play="${i}" aria-label="Play"><video src="${esc(it.videoUrl)}#t=0.1" muted playsinline preload="metadata"></video></button>
        <div class="txt">
          ${it.title ? `<div class="ttl">${esc(it.title)}</div>` : ''}
          ${it.caption ? `<div class="cap">${esc(it.caption)}</div>` : '<div class="none">(no caption)</div>'}
        </div>
      </div>
      <div class="acts">
        <a class="big dl" href="${esc(it.downloadUrl || it.videoUrl)}" download data-dl="${i}"><span class="ico">⬇</span>Download</a>
        <button class="big cp" data-copy-caption="${i}" ${it.caption ? '' : 'disabled'}><span class="ico">📋</span>Caption</button>
        <button class="big cp" data-copy-url="${i}" ${it.shopeeUrl ? '' : 'disabled'}><span class="ico">🔗</span>Link</button>
      </div>
      <div class="more">
        ${it.shopeeUrl ? `<a class="pill" href="${esc(it.shopeeUrl)}" target="_blank" rel="noopener">Open in Shopee</a>` : ''}
        <span class="sp"></span>
        <button class="pill ok" data-done="${i}">✓ Done</button>
      </div>
    </article>`).join('');

  app.innerHTML = `
    <header><h1>Shopee Videos</h1><span class="count">${items.length} / ${max}</span>
      <button class="link" id="refresh">Refresh</button><button class="link" id="out">Lock</button></header>
    <main>${rows ? `
      <div class="list">${rows}</div>` :'<div class="empty">All done 🎉 Nothing waiting to post.</div>'}</main>`;

  document.getElementById('refresh').onclick = load;
  document.getElementById('out').onclick = () => { memPass = ''; setPass(''); login(); };
  app.querySelectorAll('[data-done]').forEach((b) => b.onclick = () => markDone(items[b.dataset.done], b));
  app.querySelectorAll('[data-play]').forEach((b) => b.onclick = () => openViewer(items[b.dataset.play]));
  app.querySelectorAll('[data-copy-caption]').forEach((b) => b.onclick = () => copy(items[b.dataset.copyCaption].caption || '', b));
  app.querySelectorAll('[data-copy-url]').forEach((b) => b.onclick = () => copy(items[b.dataset.copyUrl].shopeeUrl || '', b));
  app.querySelectorAll('[data-dl]').forEach((b) => b.addEventListener('click', () => { b.classList.add('used'); toast('Downloading…'); }));
}

load();
</script>
</body>
</html>
